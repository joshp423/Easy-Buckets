{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <form action="/register" method="post">
        <div class="box">
            <div class="block">
                <input autocomplete="off" autofocus class="input is-rounded" name="username" placeholder="Username" type="text">
            </div>
            <div class="block">
                <input class="input is-rounded" name="password" placeholder="Password" type="password">
            </div>
            <div class="block">
                <input class="input is-rounded" name="confirmation" placeholder="Password Confirmation" type="password">
            </div>
            <div class="block">
                <input autocomplete="off" class="input is-rounded"" name="team" placeholder="Team Name" type="text">
            </div>
            <div class="centered">
                <button class="button is-light" type="submit">Register</button>
            </div>
        </div>
    </form>
{% endblock %}
